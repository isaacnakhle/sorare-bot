name: Sorare Floor Price Alert

on:
  schedule:
    # Every 10 minutes. GitHub may delay this a bit under load - that's
    # normal for free scheduled workflows, not a bug.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state file

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the alert bot
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SORARE_API_TOKEN: ${{ secrets.SORARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sorare_floor_alert.py

      - name: Save progress back to the repo
        run: |
          git config user.name "sorare-bot"
          git config user.email "actions@github.com"
          git add sorare_floor_state.json sorare_all_players.json || true
          git diff --cached --quiet || git commit -m "Update bot state [skip ci]"
          git push || true
